<div class="header">
    <h1 class="slidetitle">두 가지 소프트웨어 레이어, 매끄러운 경험</h1>
</div>
<div class="main">
    <div class="text">
        <div>
            <p>Solwed OS는 패키지 관리를 위해 깔끔한 두 계층 구조를 사용합니다. 기본 시스템은 안정적인 핵심 기능을 위해 <a href="https://ubuntu.com/">Ubuntu</a> 패키지(APT)를 기반으로 합니다.</p>
        </div>
        <div>
            <p>사용자용 애플리케이션의 경우, 샌드박스 방식 및 배포판 간 호환 앱 제공을 위해 Snap 대신 <a href="https://flatpak.org/">Flatpak</a>을 사용합니다. 이를 통해 애플리케이션을 시스템과 격리하고 디스크 공간을 절약하며 방대한 애플리케이션 카탈로그에 접근할 수 있습니다. 물론, 필요시 언제든지 <a href="https://appimage.org/">AppImage</a>와 전통적인 <a href="https://wiki.debian.org/Apt">APT</a>를 사용할 수 있습니다.</p>
        </div>
</div>
