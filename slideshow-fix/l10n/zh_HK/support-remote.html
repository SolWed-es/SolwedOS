<div class="header">
    <h1 class="slidetitle">支援服務，一鍵直達</h1>
</div>
<div class="main">
    <div class="text">
        <div>
            <p>遇到問題時，毋須致電解釋狀況，也毋須等待上門服務。Solwed OS 已內置 <strong>RustDesk</strong>，隨時可用：在開始選單開啟後，將畫面顯示的 ID 及密碼告知我們，支援團隊即可直接連接你的電腦——但僅限於獲得你的許可後才會連接，絕不會未經許可擅自連接。</p>
        </div>
        <div>
            <p>我們採用自家伺服器，而非使用 RustDesk 的公共伺服器，因此連接速度更快，亦不依賴任何第三方。這就如同有一位支援人員坐在你身旁，卻毋須親自到訪。</p>
        </div>
</div>
