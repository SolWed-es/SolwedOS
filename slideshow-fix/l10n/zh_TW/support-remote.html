    <h1 class="slidetitle">支援服務，一鍵直達</h1>
</div>
<div class="main">
    <div class="text">
        <div>
            <p>遇到問題時，不需要透過電話解釋狀況，也不用等待上門服務。Solwed OS 內建 <strong>RustDesk</strong>，隨時可用：從開始選單開啟它，把畫面顯示的 ID 和密碼告訴我們，我們的支援團隊就能直接連線到您的電腦——但僅在獲得您的許可後才會連線，絕不會未經許可擅自連線。</p>
        </div>
        <div>
            <p>我們運行自己的伺服器，而非使用 RustDesk 的公用伺服器，因此連線速度更快，也不依賴任何第三方。這就像有一位支援人員坐在您身旁，卻不需要親自到府。</p>
        </div>
</div>
