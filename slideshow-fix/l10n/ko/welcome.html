<p>Solwed OS를 설치해 주셔서 감사합니다!</p>

<br />
<p>Solwed OS는 Windows나 macOS에서 전환하시는 경우에도 익숙하고 사용하기 쉽도록 설계된 커스텀 <a href="https://ubuntu.com/">Ubuntu</a> 기반 리눅스 배포판입니다. Ubuntu의 방대하고 안정적인 소프트웨어 생태계를 기반으로, 데스크톱 사용에 맞춘 세심한 다듬질을 더했습니다. 여러분에게 Solwed OS의 매력을 보여드릴 수 있게 되어 기대됩니다!</p>
