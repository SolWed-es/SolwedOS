<p>شكراً لتثبيت Solwed OS!</p>

<p>Solwed OS هي توزيعة لينكس مخصصة مبنية على <a href="https://ubuntu.com/">Ubuntu</a>، مصممة لتكون مألوفة وسهلة الاستخدام، سواء كنت تنقّل من Windows أو macOS. فهي تعتمد على النظام البيئي الضخم والموثوق لبرمجيات Ubuntu، مع لمسة إضافية من الصقل لتجربة سطح المكتب. نتطلع لركنك حول!</p>
