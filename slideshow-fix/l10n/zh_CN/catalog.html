<div class="header">
    <h1 class="slidetitle">所需的一切，都已预装好</h1>
</div>
<div class="main">
    <div class="text">
        <div>
            <p>Solwed OS 从第一天起就为你的企业配备了所需的工具：用于办公的 <strong>LibreOffice</strong>（Writer、Calc、Impress 等）、内置 WhatsApp 的 <strong>Thunderbird</strong>（让邮件和消息集中在一处），以及用于企业管理和开票的 <strong>FacturaScripts</strong>。</p>
        </div>
        <div>
            <p>为方便与西班牙行政部门打交道，系统还内置了带数字 PDF 签名功能的 <strong>Autofirma</strong> 和 <strong>Okular</strong>。此外，借助 <strong>Timeshift</strong>，你随时可以创建还原点，出现问题时回退——就像 Windows 的"系统还原"一样，只不过用在 Solwed OS 上。</p>
        </div>
</div>
