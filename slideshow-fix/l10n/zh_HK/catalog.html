<div class="header">
    <h1 class="slidetitle">所需的一切，早已安裝好</h1>
</div>
<div class="main">
    <div class="text">
        <div>
            <p>Solwed OS 從第一天起就配備企業所需的工具：用於辦公室工作的 <strong>LibreOffice</strong>（Writer、Calc、Impress 等）、內置 WhatsApp 的 <strong>Thunderbird</strong>（讓電郵和訊息集中在一處），以及用於企業管理和開立發票的 <strong>FacturaScripts</strong>。</p>
        </div>
        <div>
            <p>為方便與西班牙行政機關往來，系統亦內置具備數碼 PDF 簽署功能的 <strong>Autofirma</strong> 與 <strong>Okular</strong>。此外，透過 <strong>Timeshift</strong>，你隨時都可以建立還原點，在出現問題時復原——就像 Windows 的「系統還原」一樣，只不過用在 Solwed OS 上。</p>
        </div>
</div>
